<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Lucas Jesus — Sistemas, dados e infraestrutura">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#D6D3CB"/>
    </pattern>
    <linearGradient id="fade" x1="0" x2="1">
      <stop offset="0" stop-color="#FAFAF7" stop-opacity="1"/>
      <stop offset="0.55" stop-color="#FAFAF7" stop-opacity="0.92"/>
      <stop offset="1" stop-color="#FAFAF7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .name { font: 700 52px 'Segoe UI', 'Inter', system-ui, -apple-system, sans-serif; fill: #1C1C1A; letter-spacing: -1px; }
      .role { font: 500 19px 'Segoe UI', 'Inter', system-ui, sans-serif; fill: #57534E; }
      .mono { font: 500 14px 'JetBrains Mono', 'Cascadia Code', ui-monospace, Consolas, monospace; fill: #78716C; }
      .tag  { font: 600 12px 'JetBrains Mono', ui-monospace, Consolas, monospace; fill: #0E7C66; letter-spacing: 1.5px; }
      .node { font: 600 13px 'JetBrains Mono', ui-monospace, Consolas, monospace; fill: #1C1C1A; }
      .flow { stroke: #0E7C66; stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 1.6s linear infinite; }
      .cursor { animation: blink 1.1s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
      @keyframes flow  { to { stroke-dashoffset: -28; } }
      @keyframes blink { 50% { opacity: 0; } }
      @keyframes pulse { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
    </style>
  </defs>

  <!-- fundo -->
  <rect x="1" y="1" width="1198" height="298" rx="18" fill="#FAFAF7" stroke="#E7E5E0" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="296" rx="17" fill="url(#dots)"/>
  <rect x="2" y="2" width="760" height="296" rx="17" fill="url(#fade)"/>
  <rect x="56" y="62" width="4" height="150" rx="2" fill="#0E7C66"/>

  <!-- texto -->
  <text x="80" y="82" class="tag">SISTEMAS · DADOS · INFRAESTRUTURA</text>
  <text x="78" y="140" class="name">Lucas Jesus</text>
  <text x="80" y="176" class="role">Desenvolvedor full-stack e analista de TI na indústria</text>
  <text x="80" y="214" class="mono">$ transformando processo manual em sistema<tspan class="cursor" fill="#0E7C66">▍</tspan></text>

  <!-- fluxo autoral: dado bruto → auditoria → sistema → decisão -->
  <g transform="translate(760,70)">
    <path class="flow" d="M60 30 C 130 30, 130 80, 200 80"/>
    <path class="flow" d="M200 80 C 270 80, 270 130, 340 130"/>
    <path class="flow" d="M60 30 C 120 30, 140 150, 200 150"/>
    <path class="flow" d="M200 150 C 260 150, 280 130, 340 130"/>

    <g>
      <rect x="-10" y="12" width="140" height="36" rx="9" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1.5"/>
      <text x="60" y="35" text-anchor="middle" class="node">planilha</text>
    </g>
    <g>
      <rect x="140" y="62" width="120" height="36" rx="9" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1.5"/>
      <text x="200" y="85" text-anchor="middle" class="node">auditoria</text>
    </g>
    <g>
      <rect x="140" y="132" width="120" height="36" rx="9" fill="#FFFFFF" stroke="#D6D3CB" stroke-width="1.5"/>
      <text x="200" y="155" text-anchor="middle" class="node">sistema</text>
    </g>
    <g>
      <rect x="280" y="112" width="130" height="36" rx="9" fill="#0E7C66"/>
      <text x="345" y="135" text-anchor="middle" class="node" fill="#FFFFFF" style="fill:#FFFFFF">decisão</text>
    </g>
    <circle class="pulse" cx="345" cy="176" r="4" fill="#0E7C66"/>
  </g>

  <text x="1144" y="272" text-anchor="end" class="mono" style="font-size:12px">Araçoiaba da Serra · SP · BR</text>
</svg>
